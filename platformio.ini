; PlatformIO Project Configuration File
; TTGO T-Display (ESP32 + 1.14" ST7789V IPS LCD) Camping Monitor

[env:ttgo-t-display]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
board_build.flash_mode = qio
board_build.f_cpu = 80000000L
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_flash = 80000000L
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    adafruit/Adafruit BME280 Library @ 2.3.0
    adafruit/Adafruit BMP085 Library @ 1.2.4
    adafruit/Adafruit Unified Sensor @ 1.1.15
    adafruit/Adafruit BusIO @ 1.17.2
    bblanchon/ArduinoJson @ 6.21.5

build_flags =
    -DFW_VERSION=\"0.3.0\"
    -DDISABLE_ALL_LIBRARY_WARNINGS
    ; TFT_eSPI user setup via build flags (avoids modifying library files)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=6000000

; Use ONLY after fitting the documented VBUS divider on pin 32.
[env:ttgo-t-display-usb-sense]
extends = env:ttgo-t-display
build_flags = ${env:ttgo-t-display.build_flags} -DUSB_SENSE_WIRED=1

; Bench testing before soldering: always-on Wi-Fi, NO battery saving.
[env:ttgo-t-display-service]
extends = env:ttgo-t-display
build_flags = ${env:ttgo-t-display.build_flags} -DFORCE_SERVICE_MODE=1
